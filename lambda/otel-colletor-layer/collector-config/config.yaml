receivers:
  otlp:
    protocols:
      # grpc:
      #   endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"

# processors:
#   batch:

exporters:
  logging:
    loglevel: debug
  # debug:
  #   verbosity: detailed
  # otlp/docker:
  #   endpoint: "http://host.docker.internal:4318/"
  # datadog:
  #  # should be datadog agents grpc address
  #  endpoint: "http://localhost:43177/" 
  otlp/honeycomb:
    endpoint: "api.honeycomb.io:443"
    headers:
      "x-honeycomb-team": ${env:HONEYCOMB_API_KEY}
  otlphttp/honeycomb:
    endpoint: "https://api.honeycomb.io"
    headers:
      "x-honeycomb-team": ${env:HONEYCOMB_API_KEY}
  otlphttp/ddagent:
    endpoint: "http://localhost:43188"
  # datadog:
  #   api:
  #     site: "datadoghq.eu"
  #     key: ${env:DD_API_KEY}

service:
  pipelines:
    traces:
      receivers: 
        - otlp
      processors:
        # - batch
      exporters: 
        #- otlp/honeycomb
        #- datadog
        - otlphttp/honeycomb
        - otlphttp/ddagent
    metrics:
      receivers: 
        - otlp
      processors:
        # - batch
      exporters: 
        #- otlp/honeycomb
        #- datadog
        - otlphttp/honeycomb
        - otlphttp/ddagent
        # - debug
    logs:
      receivers: 
        - otlp
      processors:
        # - batch
      exporters: 
        #- otlp/honeycomb
        #- datadog
        - otlphttp/honeycomb
        - otlphttp/ddagent
  telemetry:
    logs:
      level: debug
    metrics:
      address: localhost:8888
