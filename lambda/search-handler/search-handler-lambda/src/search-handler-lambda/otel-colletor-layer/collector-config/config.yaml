receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"

processors:
  batch:

exporters:
  logging:
    loglevel: debug
  # otlp/docker:
  #   endpoint: "http://host.docker.internal:4318/"
  # datadog:
  #  # should be datadog agents grpc address
  #  endpoint: "http://localhost:43188/" 
  otlp/honeycomb:
    endpoint: "api.honeycomb.io:443"
    headers:
      "x-honeycomb-team": "mJ8..."
  otlp/ddagent:
    endpoint: "localhost:43177"
  datadog:
    api:
      site: "datadoghq.eu"
      key: "d601...."

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      #exporters: [otlp/ddagent]
      exporters: [otlp/honeycomb, datadog, otlp/ddagent]
    metrics:
      receivers: [otlp]
      #exporters: [otlp/ddagent]
      exporters: [otlp/honeycomb, datadog, otlp/ddagent]
    logs:
      receivers: [otlp]
      #exporters: [otlp/ddagent]
      exporters: [otlp/honeycomb, datadog, otlp/ddagent]
  # telemetry:
  #   metrics:
  #     address: localhost:8888
