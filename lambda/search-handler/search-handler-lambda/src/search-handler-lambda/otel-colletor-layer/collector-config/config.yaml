receivers:
  otlp:
    protocols:
      # grpc:
      #   endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"

processors:
  batch:

exporters:
  logging:
    loglevel: debug
  # otlp/docker:
  #   endpoint: "http://host.docker.internal:4318/"
  # datadog:
  #  # should be datadog agents grpc address
  #  endpoint: "http://localhost:43177/" 
  otlp/honeycomb:
    endpoint: "api.honeycomb.io:443"
    headers:
      "x-honeycomb-team": ${env:HONEYCOMB_API_KEY}
  otlphttp/honeycomb:
    endpoint: "https://api.honeycomb.io"
    headers:
      "x-honeycomb-team": ${env:HONEYCOMB_API_KEY}
  otlp/ddagent:
    endpoint: "localhost:43177"
  datadog:
    api:
      site: "datadoghq.eu"
      key: ${env:DATADOG_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: 
        #- otlp/honeycomb
        - datadog
        - otlphttp/honeycomb
#        - otlp/ddagent
    metrics:
      receivers: [otlp]
      processors:
        - batch
      exporters: 
        #- otlp/honeycomb
        - datadog
        - otlphttp/honeycomb
#        - otlp/ddagent
    logs:
      receivers: [otlp]
      processors:
        - batch
      exporters: 
        #- otlp/honeycomb
        - datadog
        - otlphttp/honeycomb
#        - otlp/ddagent
  telemetry:
    logs:
      level: debug
    metrics:
      address: localhost:8888
